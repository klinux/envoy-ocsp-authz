# Aplica o ext_authz ao Gateway de mTLS.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: ocsp-authz
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: my-mtls-gateway
  extAuth:
    extensionRef:
      name: ocsp-authz
